<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">ProSpacer</title>
  <desc id="desc">Procedural deep-space exploration created by Profexor</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03070d"/>
      <stop offset=".55" stop-color="#071421"/>
      <stop offset="1" stop-color="#0a1019"/>
    </linearGradient>
    <radialGradient id="planet" cx=".32" cy=".22" r=".82">
      <stop offset="0" stop-color="#b9f6ff"/>
      <stop offset=".2" stop-color="#57c9e8"/>
      <stop offset=".55" stop-color="#1c5e91"/>
      <stop offset=".82" stop-color="#0c223e"/>
      <stop offset="1" stop-color="#02050a"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#79e8ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#79e8ff"/>
      <stop offset="1" stop-color="#f0b36c" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35"/>
    </filter>
    <clipPath id="planetClip">
      <circle cx="1290" cy="245" r="170"/>
    </clipPath>
  </defs>

  <rect width="1600" height="500" rx="22" fill="url(#bg)"/>
  <ellipse cx="1170" cy="220" rx="390" ry="235" fill="#1b82a4" opacity=".1" filter="url(#soft)"/>

